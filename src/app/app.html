<div class="min-h-screen bg-slate-50 text-slate-900">
  <app-messages></app-messages>
  <header class="sticky top-0 z-50 border-b border-slate-200 bg-white/95 shadow-sm backdrop-blur">
    <div class="relative mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-5 py-4 sm:flex-nowrap sm:px-8 sm:py-5">
      <a routerLink="/" class="flex items-center gap-3 no-underline" aria-label="Hero HQ home">
        <span class="grid size-11 place-items-center rounded-2xl bg-indigo-600 text-lg font-black text-white">H</span>
        <span class="text-lg font-bold tracking-tight text-slate-950">Hero HQ</span>
      </a>
      <nav class="mx-auto flex items-center rounded-full bg-slate-100 p-1 sm:absolute sm:left-1/2 sm:top-1/2 sm:mx-0 sm:-translate-x-1/2 sm:-translate-y-1/2" aria-label="Main navigation">
        <a routerLink="/" routerLinkActive="bg-white text-indigo-700 shadow-sm"
           [routerLinkActiveOptions]="{ exact: true }"
           class="rounded-full px-5 py-2 text-sm font-semibold text-slate-600 transition hover:text-slate-950">
          Dashboard
        </a>
        <a routerLink="/heroes" routerLinkActive="bg-white text-indigo-700 shadow-sm"
           class="rounded-full px-5 py-2 text-sm font-semibold text-slate-600 transition hover:text-slate-950">
          Heroes
        </a>
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-7xl px-5 py-10 sm:px-8 sm:py-14">
    <router-outlet></router-outlet>
  </main>
</div>
