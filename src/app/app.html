<div class="min-h-screen bg-slate-50 text-slate-900">
  <app-messages></app-messages>
  <header class="sticky top-0 z-50 border-b border-slate-200 bg-white/95 shadow-sm backdrop-blur">
    <div class="relative flex w-full flex-wrap items-center justify-between gap-x-4 gap-y-3 px-4 py-3 sm:flex-nowrap sm:gap-4 sm:px-8 sm:py-5">
      <a routerLink="/" class="flex shrink-0 items-center gap-3 no-underline" aria-label="Hero HQ home">
        <img src="/favicon.jpg" alt="" class="size-10 rounded-xl border border-slate-200 bg-white object-contain shadow-sm sm:size-11">
        <span class="text-lg font-bold tracking-tight text-slate-950">Hero HQ</span>
      </a>
      <nav class="order-3 mx-auto flex w-full max-w-full items-center justify-center rounded-full bg-slate-100 p-1 sm:order-none sm:w-auto sm:absolute sm:left-1/2 sm:top-1/2 sm:mx-0 sm:-translate-x-1/2 sm:-translate-y-1/2" aria-label="Main navigation">
        <a routerLink="/" routerLinkActive="bg-white text-indigo-700 shadow-sm"
           [routerLinkActiveOptions]="{ exact: true }"
           class="rounded-full px-4 py-2 text-sm font-semibold text-slate-600 transition hover:text-slate-950 sm:px-5">
          Dashboard
        </a>
        <a routerLink="/heroes" routerLinkActive="bg-white text-indigo-700 shadow-sm"
           class="rounded-full px-4 py-2 text-sm font-semibold text-slate-600 transition hover:text-slate-950 sm:px-5">
          Heroes
        </a>
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 sm:py-12 lg:px-8 lg:py-14">
    <router-outlet></router-outlet>
  </main>
</div>
