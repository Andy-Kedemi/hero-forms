<div class="min-h-screen bg-im-gray px-4 py-10">
  <div class="mx-auto max-w-lg overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm">

    <!-- Header -->
    <div class="border-b-4 border-im-orange bg-im-blue px-6 py-5">
      <h1 class="text-xl font-semibold text-white">Hero Form</h1>
    </div>

    <!-- Form -->
    <div [hidden]="submitted" class="px-6 py-6">
      <form (ngSubmit)="onSubmit()" #heroForm="ngForm" class="space-y-5">

        <div>
          <label for="name" class="mb-1.5 block text-sm font-medium text-slate-700">Name</label>
          <input type="text" id="name" name="name" required
                 [(ngModel)]="model.name" #name="ngModel"
                 class="w-full rounded-full border border-slate-300 px-5 py-3 text-slate-900
                        focus:border-im-blue focus:outline-none focus:ring-2 focus:ring-im-blue/20">
          <p [hidden]="name.valid || name.pristine" class="mt-1.5 text-sm text-red-600">
            Name is required
          </p>
        </div>

        <div>
          <label for="alterEgo" class="mb-1.5 block text-sm font-medium text-slate-700">Alter Ego</label>
          <input type="text" id="alterEgo" name="alterEgo"
                 [(ngModel)]="model.alterEgo"
                 class="w-full rounded-full border border-slate-300 px-5 py-3 text-slate-900
                        focus:border-im-blue focus:outline-none focus:ring-2 focus:ring-im-blue/20">
        </div>

        <div>
          <label for="power" class="mb-1.5 block text-sm font-medium text-slate-700">Hero Power</label>
          <select id="power" name="power" required
                  [(ngModel)]="model.power" #power="ngModel"
                  class="w-full rounded-full border border-slate-300 bg-white px-5 py-3 text-slate-900
                         focus:border-im-blue focus:outline-none focus:ring-2 focus:ring-im-blue/20">
            <option value="" disabled>Select a power</option>
            <option *ngFor="let pow of powers" [value]="pow">{{ pow }}</option>
          </select>
          <p [hidden]="power.valid || power.pristine" class="mt-1.5 text-sm text-red-600">
            Power is required
          </p>
        </div>

        <div class="flex gap-3 pt-2">
          <button type="submit" [disabled]="!heroForm.form.valid"
                  class="rounded-md bg-im-blue px-5 py-2 text-sm font-medium text-white
                         hover:bg-im-blue-dark focus:outline-none focus:ring-2 focus:ring-im-blue/40
                         disabled:cursor-not-allowed disabled:bg-slate-300">
            Submit
          </button>
          <button type="button" (click)="newHero(); heroForm.reset()"
                  class="rounded-md border border-slate-300 bg-white px-5 py-2 text-sm font-medium
                         text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-300">
            New Hero
          </button>
        </div>
      </form>
    </div>

    <!-- Summary -->
    <div [hidden]="!submitted" class="px-6 py-6">
      <h2 class="mb-4 text-lg font-semibold text-im-blue">You submitted the following</h2>
      <dl class="divide-y divide-slate-200 rounded-md border border-slate-200">
        <div class="grid grid-cols-3 gap-4 px-4 py-3">
          <dt class="text-sm font-medium text-slate-500">Name</dt>
          <dd class="col-span-2 text-sm text-slate-900">{{ model.name }}</dd>
        </div>
        <div class="grid grid-cols-3 gap-4 px-4 py-3">
          <dt class="text-sm font-medium text-slate-500">Alter Ego</dt>
          <dd class="col-span-2 text-sm text-slate-900">{{ model.alterEgo }}</dd>
        </div>
        <div class="grid grid-cols-3 gap-4 px-4 py-3">
          <dt class="text-sm font-medium text-slate-500">Power</dt>
          <dd class="col-span-2 text-sm text-slate-900">{{ model.power }}</dd>
        </div>
      </dl>
      <button type="button" (click)="submitted = false"
              class="mt-5 rounded-md bg-im-orange px-5 py-2 text-sm font-medium text-white
                     hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-im-orange/40">
        Edit
      </button>
    </div>
  </div>
</div>
