<div class="toast-stack" aria-label="Notifications" aria-live="polite">
  @for (message of messageService.messages(); track message.id) {
    <div class="toast" [class.toast-success]="message.kind === 'success'"
         [class.toast-error]="message.kind === 'error'"
         [class.toast-info]="message.kind === 'info'"
         [class.toast-warning]="message.kind === 'warning'"
         [attr.role]="message.kind === 'error' ? 'alert' : 'status'">
      <p>{{ message.text }}</p>
      <button type="button" aria-label="Dismiss notification"
              (click)="messageService.dismiss(message.id)">×</button>
    </div>
  }
</div>
